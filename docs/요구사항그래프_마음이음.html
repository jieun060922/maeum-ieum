<!DOCTYPE html>
<!-- ============================================================================
  PRD 요구사항 그래프 — 마음이음
  prd-graph 스킬 템플릿으로 생성. HTML/CSS/JS 본문은 템플릿 그대로이며,
  id 가 graph-data 인 데이터 블록만 이 프로젝트의 내용으로 채워져 있다.
============================================================================ -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>요구사항 그래프</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #1a1d24; --muted: #6b7280;
    --line: #e3e6eb; --accent: #4f46e5;
    --r-bar: #4f46e5; --f-bar: #0ea5e9; --s-bar: #94a3b8;
    --hi: #e11d48; --hi-bg: #fee2e2; --md: #d97706; --md-bg: #fef3c7; --lo: #64748b; --lo-bg: #eef2f6;
    --chip: #eef2ff; --chip-ink: #4338ca;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #181b22; --ink: #e6e8ec; --muted: #9aa2ad;
      --line: #2a2f3a; --accent: #818cf8;
      --r-bar: #818cf8; --f-bar: #38bdf8; --s-bar: #64748b;
      --hi: #fb7185; --hi-bg: #4c1d24; --md: #fbbf24; --md-bg: #422f0a; --lo: #94a3b8; --lo-bg: #232833;
      --chip: #26304d; --chip-ink: #c7d2fe;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; line-height: 1.55; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 18px 80px; }

  header.top { margin-bottom: 18px; }
  .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  h1 { margin: 4px 0 6px; font-size: 26px; }
  .mode-tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
    background: var(--chip); color: var(--chip-ink); vertical-align: middle; margin-left: 8px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; box-shadow: var(--shadow); }
  .stat b { font-size: 20px; } .stat span { color: var(--muted); font-size: 12px; margin-left: 6px; }

  .controls { display: flex; gap: 8px; margin: 16px 0 10px; }
  .controls button { font: inherit; font-size: 13px; cursor: pointer; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 8px; }
  .controls button:hover { border-color: var(--accent); color: var(--accent); }

  /* PRD panel */
  details.prd { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); margin-bottom: 22px; overflow: hidden; }
  details.prd > summary { cursor: pointer; padding: 14px 18px; font-weight: 700; font-size: 15px; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.prd > summary::-webkit-details-marker { display: none; }
  details.prd > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  details.prd[open] > summary::before { transform: rotate(90deg); }
  .prd-grid { padding: 0 18px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .prd-grid { grid-template-columns: 1fr; } }
  .prd-sec h3 { margin: 8px 0 4px; font-size: 13px; color: var(--accent); }
  .prd-sec p { margin: 0 0 8px; font-size: 14px; }
  .prd-sec .field { color: var(--muted); font-size: 12px; }
  .prd-meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; border-top: 1px dashed var(--line); }

  /* Tree */
  .tree { display: flex; flex-direction: column; gap: 10px; }
  .node { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
  .node.R { border-left-color: var(--r-bar); }
  .node.F { border-left-color: var(--f-bar); }
  .node.S { border-left-color: var(--s-bar); }
  .node-head { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; cursor: pointer; }
  .node-head.leaf { cursor: default; }
  .caret { color: var(--muted); font-size: 12px; margin-top: 3px; width: 12px; flex: none; transition: transform .15s; }
  .node.collapsed > .node-head .caret { transform: rotate(-90deg); }
  .caret.hidden { visibility: hidden; }
  .tag { font-size: 10px; font-weight: 800; letter-spacing: .05em; padding: 2px 6px; border-radius: 6px; margin-top: 2px; flex: none; }
  .tag.R { background: var(--r-bar); color: #fff; } .tag.F { background: var(--f-bar); color: #fff; } .tag.S { background: var(--s-bar); color: #fff; }
  .node-title { flex: 1; }
  .node-title .name { font-weight: 650; font-size: 15px; }
  .node.S .node-title .name { font-size: 14px; font-weight: 550; }
  .node-title .desc { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .imp { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-top: 2px; flex: none; }
  .imp.high { background: var(--hi-bg); color: var(--hi); } .imp.medium { background: var(--md-bg); color: var(--md); } .imp.low { background: var(--lo-bg); color: var(--lo); }
  .children { padding: 0 14px 12px 30px; display: flex; flex-direction: column; gap: 8px; }
  .node.collapsed > .children { display: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--chip-ink); }
  .ac { margin: 8px 0 0; padding: 8px 10px; background: var(--lo-bg); border-radius: 8px; }
  .ac .ac-t { font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
  .ac ul { margin: 0; padding-left: 16px; } .ac li { font-size: 12px; margin: 2px 0; }
  footer { margin-top: 30px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">PRD · 요구사항 그래프</div>
    <h1 id="proj">프로젝트</h1>
    <div class="stats" id="stats"></div>
  </header>

  <details class="prd" open>
    <summary>📄 PRD 요약 (제품 요구사항 문서)</summary>
    <div class="prd-grid" id="prd"></div>
  </details>

  <div class="controls">
    <button onclick="setAll(false)">전체 펼치기</button>
    <button onclick="setAll(true)">전체 접기</button>
  </div>
  <div class="tree" id="tree"></div>

  <footer>노드를 클릭하면 하위 항목이 접히고 펼쳐집니다 · prd-graph 스킬로 생성</footer>
</div>

          "roles": ["어르신 이용자", "청년 이용자"], "devices": ["모바일 웹", "PC 웹"], "specs": []
        }
      ]
    },
    {
      "id": "R-8", "name": "익명 피드백", "importance": "low",
      "description": "안내가 실제로 도움이 됐는지 확인하는 능력 영역. 개인을 식별하지 않는 숫자만 다루며 글로 쓰는 후기나 신고 기능은 포함하지 않는다.",
      "acceptanceCriteria": [
        "기관 상세에서 도움이 됐다는 표시를 남길 수 있다",
        "표시에 개인을 알아볼 수 있는 정보가 함께 남지 않는다"
      ],
      "features": [
        {
          "id": "F-21", "name": "도움이 됐어요 표시", "importance": "low",
          "description": "기관 상세 화면에서 도움이 됐다는 버튼을 누르면 그 기관의 누적 숫자가 하나 올라간다. 누가 눌렀는지는 남기지 않으며, 중복 방지는 같은 화면에서 한 번만 누를 수 있게 하는 정도로 한다.",
          "roles": ["어르신 이용자", "청년 이용자"], "devices": ["모바일 웹", "PC 웹"], "specs": []
        }
      ]
    }
  ]
}
</script>

<script>
  const data = JSON.parse(document.getElementById("graph-data").textContent);
  const MODE = { simple: "간단 모드", detail: "상세 모드", "": "" };

  document.title = "요구사항 그래프 · " + (data.project || "");
  const modeLabel = MODE[data.mode] || "";
  document.getElementById("proj").innerHTML =
    (data.project || "프로젝트") + (modeLabel ? ' <span class="mode-tag">' + modeLabel + "</span>" : "");

  // ---- stats ----
  let rC = 0, fC = 0, sC = 0;
  (data.requirements || []).forEach(r => { rC++; (r.features || []).forEach(f => { fC++; sC += (f.specs || []).length; }); });
  document.getElementById("stats").innerHTML =
    stat(rC, "요구사항") + stat(fC, "기능") + stat(sC, "스펙");
  function stat(n, l) { return '<div class="stat"><b>' + n + "</b><span>" + l + "</span></div>"; }

  // ---- PRD ----
  const p = data.prd || {};
  const sec = (title, rows) => {
    const body = rows.filter(r => r[1]).map(r => '<div class="field">' + r[0] + "</div><p>" + esc(r[1]) + "</p>").join("");
    return body ? '<div class="prd-sec"><h3>' + title + "</h3>" + body + "</div>" : "";
  };
  let prdHtml =
    sec("① 개요", [["한 줄 정의", p.subject], ["목표", p.goal], ["배경", p.background]]) +
    sec("② 핵심가치", [["사용자 문제", p.userProblem], ["해결 방안", p.solution], ["차별점", p.differentiation]]) +
    sec("③ 타겟·시나리오", [["타겟 사용자", p.targetUser], ["시나리오", p.scenario]]) +
    sec("④ 성공지표", [["핵심 지표(KPI)", p.kpi], ["리스크", p.risk]]);
  const metaChips = []
    .concat(p.category ? ['<span class="chip">📂 ' + esc(p.category) + "</span>"] : [])
    .concat((p.roles || []).map(r => '<span class="chip">👤 ' + esc(r) + "</span>"))
    .concat((p.devices || []).map(d => '<span class="chip">🖥 ' + esc(d) + "</span>"));
  if (metaChips.length) prdHtml += '<div class="prd-meta">' + metaChips.join("") + "</div>";
  document.getElementById("prd").innerHTML = prdHtml;

  // ---- Tree ----
  document.getElementById("tree").innerHTML = (data.requirements || []).map(r => reqNode(r)).join("");

  function reqNode(r) {
    const kids = (r.features || []).map(f => featNode(f)).join("");
    let acc = "";
    if (r.acceptanceCriteria && r.acceptanceCriteria.length) {
      acc = '<div class="ac"><div class="ac-t">✔ 수락기준</div><ul>' +
        r.acceptanceCriteria.map(a => "<li>" + esc(a) + "</li>").join("") + "</ul></div>";
    }
    return nodeShell("R", r, acc, kids, kids !== "");
  }
  function featNode(f) {
    const kids = (f.specs || []).map(s => nodeShell("S", s, chips(s), "", false)).join("");
    return nodeShell("F", f, chips(f), kids, kids !== "");
  }
  function chips(x) {
    const c = [].concat((x.roles || []).map(r => '<span class="chip">👤 ' + esc(r) + "</span>"))
                .concat((x.devices || []).map(d => '<span class="chip">🖥 ' + esc(d) + "</span>"));
    return c.length ? '<div class="chips">' + c.join("") + "</div>" : "";
  }
  function nodeShell(kind, item, extra, childrenHtml, hasKids) {
    const imp = item.importance ? '<span class="imp ' + item.importance + '">' + impLabel(item.importance) + "</span>" : "";
    const caret = '<span class="caret ' + (hasKids ? "" : "hidden") + '">▾</span>';
    const head =
      '<div class="node-head ' + (hasKids ? "" : "leaf") + '" onclick="toggle(this)">' +
        caret +
        '<span class="tag ' + kind + '">' + kind + "</span>" +
        '<div class="node-title"><div class="name">' + esc(item.name || "") + "</div>" +
          (item.description ? '<div class="desc">' + esc(item.description) + "</div>" : "") +
          extra +
        "</div>" + imp +
      "</div>";
    const kids = childrenHtml ? '<div class="children">' + childrenHtml + "</div>" : "";
    return '<div class="node ' + kind + '">' + head + kids + "</div>";
  }
  function impLabel(i) { return i === "high" ? "높음" : i === "low" ? "낮음" : "보통"; }
  function toggle(el) {
    const node = el.closest(".node");
    if (node.querySelector(":scope > .children")) node.classList.toggle("collapsed");
  }
  function setAll(collapsed) {
    document.querySelectorAll(".node").forEach(n => {
      if (n.querySelector(":scope > .children")) n.classList.toggle("collapsed", collapsed);
    });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
</script>
</body>
</html>
